[package]
name = "keygrid"
version = "1.1.0"
description = "Precision BPM and key analyzer for studio engineers"
edition = "2021"

[lib]
name = "keygrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
