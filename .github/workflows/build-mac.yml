name: Build Keygrid for Mac

on:
  workflow_dispatch:      # run it any time from the Actions tab
  push:
    branches: [main]      # every update to the app builds a fresh download
    paths-ignore: ['README.md', 'docs/**', 'CHANGELOG.md', 'scripts/release-notes.py', '.github/workflows/release-notes.yml']

permissions:
  contents: write         # lets the build attach the installer to a Release

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install
        run: npm ci

      - name: Build universal app (Apple Silicon + Intel)
        run: npm run build

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Keygrid-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Read version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Write release notes from CHANGELOG.md
        run: python3 scripts/release-notes.py "${{ steps.ver.outputs.v }}" > release-notes.md

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Keygrid ${{ steps.ver.outputs.v }}
          make_latest: true
          overwrite_files: true
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          body_path: release-notes.md
