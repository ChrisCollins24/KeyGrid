name: Build Keygrid for Mac

on:
  workflow_dispatch:      # run it any time from the Actions tab
  push:
    tags: ['v*']          # pushing a version tag like v1.0.0 builds and publishes a download

permissions:
  contents: write         # lets the build attach the installer to a Release

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install
        run: npm ci

      - name: Build universal app (Apple Silicon + Intel)
        run: npm run build

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Keygrid-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish the download (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Keygrid ${{ github.ref_name }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          body: |
            **Download the .dmg below**, open it, and drag Keygrid into Applications.

            First time only: open Keygrid once, then go to System Settings → Privacy & Security and click **Open Anyway**.
            Works on Apple Silicon and Intel Macs running macOS 11 or newer.
